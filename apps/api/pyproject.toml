[project]
name = "ibge-api"
version = "0.1.0"
description = "API e pipeline das Projeções da População IBGE (revisão 2024)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2",
    "pydantic-settings>=2",
    "sqlalchemy>=2",
    "pymysql",
    "alembic",
    "pandas>=2.2",
    "python-calamine",
    "pyarrow",
    "numpy",
    "openpyxl",
    "httpx",
    "pyyaml",
    "python-multipart",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
