  regra_status: filhos_por_mulher
- id: tmi_t
  nome: Mortalidade infantil
  sigla: TMI
  definicao: Óbitos de menores de 1 ano para cada mil nascidos vivos.
  formula: óbitos infantis / nascidos vivos × 1000
  unidade: por mil
  casas_decimais: 2
