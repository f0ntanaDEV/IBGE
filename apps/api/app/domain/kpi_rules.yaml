- id: crescimento_anual
  metric_id: pop_t
  basis: yoy_pct
  good: { gt: 0.5 }
  warn: { gte: 0, lte: 0.5 }
  action: Revisar projetos de expansão de infraestrutura e priorizar adaptação e manutenção da rede existente.
  thresholds: "Favorável acima de 0,5% ao ano; Atenção de 0% a 0,5%; Crítico abaixo de 0%."
- id: esperanca_vida
  metric_id: e0_t
  basis: vs_brazil
  good: { gte: 0 }
  warn: { gte: -1, lt: 0 }
  action: Priorizar atenção primária, saneamento e prevenção de mortes evitáveis no território.
  thresholds: "Favorável igual ou acima do Brasil (ou do ano anterior); Atenção até 1 ano abaixo; Crítico mais de 1 ano abaixo."
- id: filhos_por_mulher
  metric_id: tft
  basis: value
  good: { gte: 2.1 }
  warn: { gte: 1.6, lt: 2.1 }
  action: Planejar para menos nascimentos, com rede escolar e conciliação entre trabalho e família.
  thresholds: "Favorável a partir de 2,1; Atenção de 1,6 a 2,1; Crítico abaixo de 1,6."
- id: envelhecimento
  metric_id: ie60
  basis: value
  good: { lt: 50 }
  warn: { gte: 50, lte: 100 }
  action: Ampliar cuidados de longa duração, geriatria e acessibilidade urbana.
  thresholds: "Favorável abaixo de 50; Atenção de 50 a 100; Crítico acima de 100."
- id: mortalidade_infantil
  metric_id: tmi_t
  basis: value
  good: { lte: 10 }
  warn: { gt: 10, lte: 15 }
  action: Reforçar pré-natal, parto seguro, vacinação e leitos neonatais.
  thresholds: "Favorável até 10 por mil; Atenção de 10 a 15; Crítico acima de 15."
- id: idosos_populacao
  metric_id: p_60
  basis: value
  good: { lt: 10 }
  warn: { gte: 10, lte: 20 }
  action: Dimensionar saúde, previdência e cuidado para uma população mais velha.
  thresholds: "Favorável abaixo de 10%; Atenção de 10% a 20%; Crítico acima de 20%."
- id: criancas_10_anos
  metric_id: p_0_14
  basis: delta10_pp
  good: { gte: 0 }
  warn: { gte: -3, lt: 0 }
  action: Reavaliar a oferta de creches e escolas e redirecionar a capacidade ociosa.
  thresholds: "Favorável variação de 10 anos igual ou acima de 0 p.p.; Atenção de −3 a 0 p.p.; Crítico abaixo de −3 p.p."
- id: dependencia
  metric_id: rdt65
  basis: value
  good: { lte: 45 }
  warn: { gt: 45, lte: 55 }
  action: Aproveitar a janela restante para elevar produtividade, escolaridade e formalização.
  thresholds: "Favorável até 45; Atenção de 45 a 55; Crítico acima de 55."
- id: maior_grupo
  metric_id: maior_grupo
  basis: value
  good: { lt: 30 }
  warn: { gte: 30, lt: 45 }
  action: Rever a oferta de serviços. O maior grupo já está na vida adulta e a demanda deixa de ser a de crianças.
  thresholds: "Favorável se o maior grupo começa antes dos 30 anos; Atenção de 30 a 44; Crítico a partir de 45."
- id: pop_0_4
  metric_id: pop_0_4
  basis: delta10_rel
  good: { gte: 0 }
  warn: { gte: -15, lt: 0 }
  action: Readequar creches e a primeira etapa do ensino à queda do grupo de 0 a 4 anos.
  thresholds: "Favorável variação de 10 anos igual ou acima de 0%; Atenção de −15% a 0%; Crítico abaixo de −15%."
- id: pop_80
  metric_id: pop_80
  basis: delta10_rel
  good: { lt: 20 }
  warn: { gte: 20, lte: 40 }
  action: Ampliar cuidado de longa duração, geriatria e moradia acessível para o grupo de 80 anos ou mais.
  thresholds: "Favorável crescimento em 10 anos abaixo de 20%; Atenção de 20% a 40%; Crítico acima de 40%."
- id: razao_80_0_4
  metric_id: razao_80_0_4
  basis: value
  good: { lt: 0.5 }
  warn: { gte: 0.5, lte: 1 }
  action: Planejar cuidado de longa duração. Já há muitas pessoas de 80 anos ou mais para cada criança de 0 a 4.
  thresholds: "Favorável abaixo de 0,5; Atenção de 0,5 a 1; Crítico acima de 1."
- id: idade_ativa
  metric_id: p_15_64_t
  basis: value
  good: { gte: 65 }
  warn: { gte: 60, lt: 65 }
  action: Aproveitar a parcela ainda alta em idade ativa para elevar produtividade, escolaridade e formalização.
  thresholds: "Favorável a partir de 65%; Atenção de 60% a 65%; Crítico abaixo de 60%."
- id: idosos_65
  metric_id: p_65_mais_t
  basis: value
  good: { lt: 10 }
  warn: { gte: 10, lte: 20 }
  action: Dimensionar saúde, previdência e cuidado para uma população com mais pessoas de 65 anos ou mais.
  thresholds: "Favorável abaixo de 10%; Atenção de 10% a 20%; Crítico acima de 20%."
- id: idosos_80
  metric_id: p_80_mais_t
  basis: value
  good: { lt: 3 }
  warn: { gte: 3, lte: 6 }
  action: Ampliar cuidados de longa duração e a rede de apoio a quem tem 80 anos ou mais.
  thresholds: "Favorável abaixo de 3%; Atenção de 3% a 6%; Crítico acima de 6%."
- id: idade_mediana
  metric_id: id_med
  basis: value
  good: { lt: 30 }
  warn: { gte: 30, lte: 40 }
  action: Antecipar a mudança da demanda, de serviços para jovens para serviços para adultos e idosos.
  thresholds: "Favorável abaixo de 30 anos; Atenção de 30 a 40; Crítico acima de 40."
- id: risco_1_ano
  metric_id: nqx_0
  basis: value
  good: { lte: 10 }
  warn: { gt: 10, lte: 15 }
  action: Reforçar pré-natal, parto seguro, vacinação e leitos neonatais.
  thresholds: "Favorável até 10 por mil; Atenção de 10 a 15; Crítico acima de 15."
- id: chegam_80
  metric_id: lx_80
  basis: value
  good: { gte: 55 }
  warn: { gte: 45, lt: 55 }
  action: Reduzir a mortalidade adulta evitável, sobretudo masculina, por violência, acidentes e doenças crônicas.
  thresholds: "Favorável a partir de 55 de cada 100; Atenção de 45 a 55; Crítico abaixo de 45."
- id: vida_60
  metric_id: e60
  basis: value
  good: { gte: 22 }
  warn: { gte: 20, lt: 22 }
  action: Fortalecer o cuidado de doenças crônicas e o envelhecimento ativo.
  thresholds: "Favorável a partir de 22 anos; Atenção de 20 a 22; Crítico abaixo de 20."
- id: validacoes
  metric_id: validacoes
  basis: pct_rows
  good: { gte: 100 }
  warn: { gte: 95, lt: 100 }
  action: Não publicar análises até investigar as regras com falha na página de Qualidade.
  thresholds: "Favorável com 100% das regras aprovadas; Atenção de 95% a 100%; Crítico abaixo de 95%."
- id: atipicos
  metric_id: atipicos
  basis: pct_rows
  good: { lt: 0.5 }
  warn: { gte: 0.5, lte: 2 }
  action: Revisar a regra de detecção ou a carga. Atípicos em dados oficiais costumam indicar falso positivo.
  thresholds: "Favorável abaixo de 0,5% das linhas; Atenção de 0,5% a 2%; Crítico acima de 2%."
