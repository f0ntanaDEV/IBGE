services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ibge
      MYSQL_USER: ibge
      MYSQL_PASSWORD: ibge
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    volumes:
      - mysql_data:/var/lib/mysql

  api:
    build: ./apps/api
    env_file:
      - path: .env
        required: false
    environment:
      MYSQL_HOST: mysql
      DATA_DIR: /data
      MYSQL_REQUIRED: "true"
    ports:
      - "8001:8000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8082:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mysql_data:
